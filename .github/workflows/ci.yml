# Continuous integration for the Yalla frontend monorepo.
#
# Everything that can say "this is broken" without a phone, a tablet or a
# backend. Five gates, and the one people are most tempted to drop is the one
# that matters most in a three-language product — see `i18n:check` below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The contract job below is the reason this is here: it needs credentials a
  # fork's pull request does not get, so when it cannot run automatically it
  # still has to be runnable deliberately.
  workflow_dispatch:

# A second push to the same branch makes the first run pointless. Cancelling it
# is what keeps the queue short enough that people actually wait for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Stated here rather than left to a `.env` file, which is gitignored and so
    # does not exist on a runner. The web app's config resolves this at first
    # use and throws with the variable's name when it is missing — correct
    # behaviour, and a confusing way to find out that CI simply has no
    # environment. The value is a placeholder: nothing in this job reaches a
    # backend, and every test that touches data uses the in-memory mock.
    env:
      VITE_API_URL: http://localhost:5086

    steps:
      - uses: actions/checkout@v7

      # pnpm before Node, because `setup-node`'s pnpm cache needs the binary to
      # exist in order to ask it where the store is.
      #
      # The version is not pinned here: `packageManager` in package.json pins it
      # to 11.25.0, and a second copy of that number is a second thing to forget.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # From .nvmrc, so a developer's shell and CI cannot drift.
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` is the point of running this in CI at all: it fails
      # when the lockfile does not match package.json, which is how a dependency
      # someone added locally and never committed is caught here rather than by
      # the next person's install.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      # Deliberately a build failure, not a warning.
      #
      # A key added in English and missing in Armenian ships an English string
      # to a waiter who does not read it, and nobody notices until a shift.
      # Parity is cheap to enforce and expensive to discover.
      - name: Translation parity
        run: pnpm i18n:check

      # Before the tests, and no longer *for* them.
      #
      # `apps/web/src/productionBundle.test.ts` builds its own bundle now, with
      # the variables it asserts about pinned, because reusing whatever happened
      # to be in `dist/` made the test a statement about the environment that
      # built it. This step is kept anyway and kept first: it costs seconds, and
      # a broken build reading as a broken build rather than as a mysterious
      # test failure is worth those seconds.
      - name: Build the web console
        run: pnpm build:web

      - name: Test
        run: pnpm test

  # Can the contract suite run on this trigger at all?
  #
  # Its own job because the `secrets` context is not available in a job-level
  # `if`, only inside a step — so answering the question needs a step, and
  # gating on the answer needs the job below to depend on this one.
  #
  # The alternative was leaving `contract` to fail at the backend checkout with
  # "Input required and not supplied: token" on every push from anyone without
  # the credentials, including every fork. A job that is always red is a job
  # everybody learns to scroll past, and it takes the rest of the workflow's
  # credibility with it.
  contract-preflight:
    name: is a live contract run configured?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - name: Look for the credentials the contract run needs
        id: secrets
        env:
          BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
          CONTRACT_VENUE_EMAIL: ${{ secrets.CONTRACT_VENUE_EMAIL }}
          CONTRACT_VENUE_PASSWORD: ${{ secrets.CONTRACT_VENUE_PASSWORD }}
          CONTRACT_JWT_KEY: ${{ secrets.CONTRACT_JWT_KEY }}
        run: |
          missing=()
          for name in BACKEND_REPO_TOKEN CONTRACT_VENUE_EMAIL CONTRACT_VENUE_PASSWORD CONTRACT_JWT_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'configured=false' >> "$GITHUB_OUTPUT"
          # A notice rather than a warning: on a fork's pull request this is the
          # expected state, not a problem with the change under test.
          echo "::notice title=Contract suite skipped::Missing ${missing[*]}. The mock adapter is still checked by the build job; the live half needs these secrets and a backend, and can be run from the Actions tab once they are set."

  # The half of the contract suite that makes the other half mean anything.
  #
  # `packages/api/src/contract` is one set of assertions run against both
  # implementations of the gateway interfaces. The `build` job above runs it
  # against the mock adapter, which is fast and offline — and on its own is
  # exactly the problem it was written to fix. The mock is only trustworthy
  # while something checks it against the real thing.
  #
  # Its own job because it needs a database and a backend container, and because
  # a failure here means something different from a failure above: the two
  # implementations disagree, and one of them is lying to every test that uses
  # it.
  contract:
    name: contract suite against a live backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: contract-preflight
    # Skipped, not failed, when the credentials are not here. The suite is
    # exactly as valuable as before on the repository that has them.
    if: needs.contract-preflight.outputs.configured == 'true'

    services:
      # The backend's own dependency. `sqlcmd` is not needed: the API migrates
      # and seeds on startup.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CONTRACT_SQL_PASSWORD || 'Yalla!Contract1' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      # The backend lives in its own repository. Checked out beside this one and
      # run from source rather than from a published image, so the contract runs
      # against the branch that is actually shipping.
      - name: Check out the backend
        uses: actions/checkout@v7
        with:
          repository: grigoravagyann/Yalla
          ref: master
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start the API
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Yalla: >-
            Server=localhost,1433;Database=Yalla;User Id=sa;Password=${{ secrets.CONTRACT_SQL_PASSWORD || 'Yalla!Contract1' }};TrustServerCertificate=True;MultipleActiveResultSets=True
          # It refuses to start without these, and the contract run signs in as
          # this account to reach the console reads.
          PlatformAdmin__Email: ${{ secrets.CONTRACT_VENUE_EMAIL }}
          PlatformAdmin__Password: ${{ secrets.CONTRACT_VENUE_PASSWORD }}
          Jwt__SigningKey: ${{ secrets.CONTRACT_JWT_KEY }}
          # Off, or every request acts as the seeded waiter regardless of the
          # token and the suite would be testing a role nobody signs in as.
          DevActor__Enabled: 'false'
        run: |
          dotnet run --project src/Yalla.Api/Yalla.Api.csproj &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5086/api/public/venues >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "The API never came up; the contract suite has nothing to run against." >&2
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Against the running backend. A capability the run cannot authenticate
      # for prints its reason in the test name rather than passing quietly — see
      # `ContractSubject.unsupported`.
      - name: Contract suite
        env:
          YALLA_CONTRACT_BASE_URL: http://localhost:5086
          YALLA_CONTRACT_VENUE_EMAIL: ${{ secrets.CONTRACT_VENUE_EMAIL }}
          YALLA_CONTRACT_VENUE_PASSWORD: ${{ secrets.CONTRACT_VENUE_PASSWORD }}
        run: pnpm --filter @yalla/api exec vitest run src/contract
