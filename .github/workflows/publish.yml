# Builds the web console's production image (apps/web/Dockerfile) and pushes
# it to GitHub Container Registry. Separate from ci.yml on purpose: CI proves
# the code, this produces the artifact the server pulls, and only after a
# push to main or a release tag.
#
# What it pushes:
#   ghcr.io/grigoravagyann/yalla-web:<sha>      every run
#   ghcr.io/grigoravagyann/yalla-web:latest     pushes to main
#   ghcr.io/grigoravagyann/yalla-web:v1.2.3     tags v*
#
# The image is per environment: `VITE_API_URL` and `VITE_PUBLIC_ORIGIN` are
# baked into the bundle and into the Content-Security-Policy at build time.
# Both come from the repository variable PUBLIC_ORIGIN (Settings → Secrets and
# variables → Actions → Variables), because in production the web and the API
# share one origin — the outer Caddy proxies `/api/*` to the backend. When the
# variable is not set the build falls back to https://yalla.am, so a fresh
# fork or a forgotten setting still produces a working production image
# rather than one that talks to nothing.
#
# No secret beyond GITHUB_TOKEN: `packages: write` is enough to push to the
# repository's own namespace on ghcr.io.
name: Publish web image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/grigoravagyann/yalla-web
  # The site's origin. `vars.PUBLIC_ORIGIN` when set; https://yalla.am otherwise.
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN || 'https://yalla.am' }}

jobs:
  publish:
    name: build, smoke, push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      # Built once, loaded into the local daemon for the smoke test, pushed only
      # after it passes. The second `build-push-action` is a cache hit, not a
      # rebuild.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:smoke
          build-args: |
            VITE_API_URL=${{ env.PUBLIC_ORIGIN }}
            VITE_PUBLIC_ORIGIN=${{ env.PUBLIC_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: bash apps/web/deploy/smoke.sh "${IMAGE}:smoke" "${PUBLIC_ORIGIN}"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ env.PUBLIC_ORIGIN }}
            VITE_PUBLIC_ORIGIN=${{ env.PUBLIC_ORIGIN }}
          cache-from: type=gha
