<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- No page in the console sends its URL anywhere. The reset-password page
         accepts a sign-in token in the query as a fallback for chat apps that
         drop fragments, and a query travels in the Referer header where a
         fragment never does. The page strips it before any request leaves;
         this makes sure nothing else ever carries one. -->
    <meta name="referrer" content="no-referrer" />

    <!-- Installed as a PWA on Android tablets. `start_url` in the manifest
         points at /staff, so installing from the floor screen gives a waiter an
         icon that opens straight into the room. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- color.primary from @yalla/tokens; the manifest carries the same value. -->
    <meta name="theme-color" content="#1E5B3C" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <title>Yalla</title>

    <!--
      Link-preview tags, and the honest limit of them.

      This is a single-page app with no server rendering, so every URL is served
      this same shell. WhatsApp's fetcher, Telegram's, Slack's and Facebook's do
      not run JavaScript, which means the per-venue tags the branch page sets at
      runtime (`src/public/meta.ts`) reach none of them. What they get is
      exactly what is below.

      So these are deliberately venue-agnostic rather than absent. A shared link
      then unfurls as a Yalla card with a line about seeing free tables, which
      is tapped; a link with no tags at all unfurls as a bare blue URL, which is
      scrolled past. Per-venue cards need a server that can render five tags per
      URL — the backend's meta endpoint behind a prerender, or an edge function
      — and that is deliberately out of scope here rather than faked.

      The `og:image` is added at build time rather than written here, by the
      `yalla:og-card` plugin in `vite.config.ts`, and **only when
      `VITE_PUBLIC_ORIGIN` is set**. The asset itself is a real 1200x630 PNG now
      (`public/og-card.png`, generated by `scripts/generate-og-card.mjs`), which
      answers the old objection that the only brand asset was an SVG no unfurler
      renders. What remains true is that the URL has to be absolute — several
      fetchers drop a relative one — and a build has no origin unless somebody
      supplies it. Hard-coding a placeholder that did not get substituted would
      ship a tag pointing at nothing, and a card with a broken image slot looks
      worse than the plain `summary` card below. So with the origin set this
      becomes `summary_large_image` with the card attached; without it, exactly
      what you see here.
    -->
    <meta
      name="description"
      content="See which tables are free right now, and book one. No app, no account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yalla" />
    <meta property="og:title" content="Yalla — see free tables, book a table" />
    <meta
      property="og:description"
      content="See which tables are free right now, and book one. No app, no account."
    />
    <meta property="og:locale" content="hy_AM" />
    <meta property="og:locale:alternate" content="ru_AM" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yalla — see free tables, book a table" />
    <meta
      name="twitter:description"
      content="See which tables are free right now, and book one. No app, no account."
    />

    <!--
      The fonts are deliberately NOT preloaded.

      `Yalla Sans` and `Yalla Serif` are single faces covering Latin, Cyrillic
      and Armenian plus the dram sign, which is why they are 83 kB and 98 kB —
      together more than the whole JavaScript bundle this page needs. Preloading
      them puts 182 kB in front of the code that renders anything, and on a 3G
      connection that is seconds of blank page bought to avoid a reflow.

      `@font-face` already carries `font-display: swap`, so the page paints
      immediately in the fallback stack and the real faces swap in when they
      arrive. Content first; the swap is the price and it is the right one here.

      The proper fix is smaller fonts rather than earlier ones: splitting each
      face by `unicode-range` would let a Latin-reading visitor download the
      Latin subset alone. That belongs in `packages/tokens/scripts/build-fonts.py`.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
