<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installed as a PWA on Android tablets. `start_url` in the manifest
         points at /staff, so installing from the floor screen gives a waiter an
         icon that opens straight into the room. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- color.primary from @yalla/tokens; the manifest carries the same value. -->
    <meta name="theme-color" content="#1E5B3C" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <title>Yalla</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
